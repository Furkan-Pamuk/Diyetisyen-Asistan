name: dietitian_flutter
description: Dietitian assistant — supplier reminders, inventory, weekly grocery list.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.2
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  timezone: ^0.9.4
  intl: ^0.19.0
  uuid: ^4.4.0
  share_plus: ^10.1.2
  pdf: ^3.11.1
  printing: ^5.14.2
  excel: ^4.0.3
  archive: ^3.6.1
  xml: ^6.5.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  record: ^6.0.0
  audioplayers: ^6.1.0
  http: ^1.2.2
  path_provider: ^2.1.4
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/imha_tutanak_sablonu.xlsx
